name: Cargo cache

# A tag build can restore caches saved on main but not ones saved by earlier tags, so this keeps
# the release build's cache fresh from main. The key must match the macos job in release.yml.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - app/**
      - crates/**
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-cache
  cancel-in-progress: true

jobs:
  build:
    name: Release build (cache only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release

      - run: cargo build --release --locked --target aarch64-apple-darwin -p vaultkeeper

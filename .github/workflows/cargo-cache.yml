name: Cargo cache

# A tag build can restore caches saved on main but not ones saved by earlier tags, so main seeds
# the release build's dependency cache. The keys must match the macos and windows-build jobs in
# release.yml.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/cargo-cache.yml
  # Caches unused for 7 days are evicted; a run that hits the cache only restores it, which keeps it.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-cache
  cancel-in-progress: true

jobs:
  deps:
    name: Release dependencies (cache only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin

      # The key ignores workspace crate versions, so a release version bump is a full hit and skips the cook.
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: macos-release

      # rust-cache never stores workspace crates, so cooking only the dependencies saves the same cache
      # as a full app build. The flags must match scripts/bundle-macos.sh or the tag build rebuilds them.
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          command -v cargo-chef || cargo install cargo-chef --locked --version 0.1.78
          cargo chef prepare --recipe-path "$RUNNER_TEMP/recipe.json"
          cargo chef cook --release --locked --target aarch64-apple-darwin -p vaultkeeper \
            --recipe-path "$RUNNER_TEMP/recipe.json"

  windows-deps:
    name: Windows ${{ matrix.arch }} release dependencies (cache only)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc, prebuilt_nasm: "1"}
          - {arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, prebuilt_nasm: "0"}
    env:
      AWS_LC_SYS_PREBUILT_NASM: ${{ matrix.prebuilt_nasm }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ensure-clang-cl
        if: matrix.arch == 'arm64'

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      # Same key as the windows-build job in release.yml (one per architecture), so the tag build only restores.
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-release-${{ matrix.arch }}

      # Same split as the macOS job: only the dependencies are cooked, because rust-cache never
      # stores workspace crates. The flags must match scripts/bundle-windows.ps1.
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          command -v cargo-chef || cargo install cargo-chef --locked --version 0.1.78
          cargo chef prepare --recipe-path "$RUNNER_TEMP/recipe.json"
          cargo chef cook --release --locked --target ${{ matrix.target }} -p vaultkeeper \
            --recipe-path "$RUNNER_TEMP/recipe.json"

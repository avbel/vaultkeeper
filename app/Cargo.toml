[package]
name = "vaultkeeper"
description = "Lightweight desktop client for Vaultwarden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vaultkeeper"
path = "src/lib.rs"

[[bin]]
name = "vaultkeeper"
path = "src/main.rs"

[[example]]
name = "e2e_browser_bot"
path = "examples/e2e_browser_bot.rs"
required-features = ["vw-it"]

[features]
# End-to-end tests against the docker Vaultwarden (scripts/e2e.sh). Also lets a `--daemon` built
# with it accept the test process as its UI peer and skip the keychain's real item names; release
# builds never have it.
vw-it = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
# The updater's Ed25519 release signatures (daemon/update); already in the build through ssh-key.
ed25519-dalek = "2.2.0"
hmac.workspace = true
image.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
vk-api.workspace = true
vk-crypto.workspace = true
vk-gen.workspace = true
vk-ipc.workspace = true
vk-platform.workspace = true
vk-ssh.workspace = true
vk-vault.workspace = true
vk-webauthn.workspace = true
# Local wall-clock time of the last sync in the tray menu.
chrono.workspace = true
global-hotkey.workspace = true
# The updater's GitHub client (daemon/update); already in the build through vk-api.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Software renderer only: the window process measured +28 MB resident after a window is dropped
# with it, against +45 MB with femtovg (docs/solutions/vaultkeeper-architecture.md, step 0).
slint = { workspace = true, features = [
    "std",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
thiserror.workspace = true
# `process` spawns and reaps the UI process, `signal` turns SIGTERM into a graceful quit.
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(not(windows))'.dependencies]
# Security keys over USB HID (CTAP2 with PIN, CTAP1/U2F with the AppID fallback); Firefox's
# implementation. Pure-Rust crypto for the PIN protocol instead of the default NSS. Fails to build
# on Windows (libc vs winapi c_void); there the webauthn.dll backend takes over (step 5c).
authenticator = { version = "0.5.0", default-features = false, features = ["crypto_rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
# fcntl in the UI spawn's pre-exec hook (daemon/launcher/linux.rs).
libc = "0.2.191"
secure_memory.workspace = true
vk-linux.workspace = true
# Portals without GTK: app registration, GlobalShortcuts, OpenURI, RemoteDesktop + Clipboard
# (auto-type), Settings, Background. tokio matches the workspace runtime.
ashpd = { version = "0.14.1", default-features = false, features = [
    "tokio",
    "background",
    "clipboard",
    # File dialogs on the shared connection; rfd's portal backend opens its own after hardening.
    "file_chooser",
    "global_shortcuts",
    "open_uri",
    "remote_desktop",
    # remote_desktop imports screencast::Stream, so it does not build without it.
    "screencast",
    "settings",
] }
# Tray. Slint's `system-tray` feature already builds ksni with `async-io`, and ksni rejects
# both runtimes at once, so this follows it. ksni needs zbus 5, so the build carries two zbus
# majors next to ashpd's zbus 6.
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# Signal streams from zbus (the portal restart watcher); already in the tree through ashpd.
futures-util = { version = "0.3", default-features = false }
# Same major as ashpd, for session-bus calls outside the portals (notifications).
zbus = { version = "6.0.0", default-features = false, features = ["tokio"] }
# Auto-type on wlroots compositors: zwp_virtual_keyboard_v1. Already in the tree through
# Slint's Wayland backend. `system` (libwayland, which winit already uses) lets the portal route
# read the keyboard layout on the window's own connection.
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# Character to legacy keysym (xkb_utf32_to_keysym) for the portal route; pure Rust, already in the
# tree through xkbcommon.
xkeysym = "0.2.1"
# The session's keymap, to check that the active layout can type a text before the portal route
# types it. Loads libxkbcommon at run time; already in the tree, and loaded, through winit.
xkbcommon-dl = "0.4.2"

[target.'cfg(windows)'.dependencies]
# Native open/save panels for attachments; IFileDialog, no portal or Wayland backends.
rfd = { version = "0.18.0", default-features = false }
vk-win.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Activation policy (Dock icon only while the Manager is open) and the cursor's screen for the
# Quick Panel; the same objc2 generation global-hotkey and rfd already pull in.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "libc",
    "std",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSView",
    "NSWindow",
    "NSEvent",
    "NSImage",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWorkspace",
] }
# Auto-type: Accessibility trust options and synthesized key events. Both already in the tree
# through objc2-app-kit and arboard.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSObject",
    "NSString",
] }
# Native open/save panels for attachments; no portal or Wayland backends on macOS.
rfd = { version = "0.18.0", default-features = false }

[dev-dependencies]
# Registers e2e accounts with the client's own crypto, as the vk-vault scenarios do.
vk-crypto.workspace = true
# Internal Slint crate without semver guarantees; must match the slint version exactly.
i-slint-backend-testing = "=1.19.0"
reqwest.workspace = true
tempfile = "3.27.0"
wiremock.workspace = true
# Paused clock for the hotkey pause limit.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
slint-build = "1.19.0"
embed-resource = "3"

[lints]
workspace = true

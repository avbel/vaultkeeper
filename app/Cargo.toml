[package]
name = "bw-lite"
description = "Lightweight desktop client for Vaultwarden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bw_lite"
path = "src/lib.rs"

[[bin]]
name = "bw-lite"
path = "src/main.rs"

[features]
# End-to-end tests against the docker Vaultwarden (scripts/e2e.sh). Also lets a `--daemon` built
# with it accept the test process as its UI peer and skip the keychain's real item names; release
# builds never have it.
vw-it = []

[dependencies]
anyhow.workspace = true
bwl-api.workspace = true
bwl-crypto.workspace = true
bwl-gen.workspace = true
bwl-ipc.workspace = true
bwl-platform.workspace = true
bwl-ssh.workspace = true
bwl-vault.workspace = true
# Local wall-clock time of the last sync in the tray menu.
chrono.workspace = true
global-hotkey.workspace = true
serde.workspace = true
serde_json.workspace = true
# Software renderer only: the window process measured +28 MB resident after a window is dropped
# with it, against +45 MB with femtovg (docs/solutions/bw-lite-architecture.md, step 0).
slint = { workspace = true, default-features = false, features = [
    "std",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
thiserror.workspace = true
# `process` spawns and reaps the UI process, `signal` turns SIGTERM into a graceful quit.
tokio = { workspace = true, features = ["process", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Activation policy (Dock icon only while the Manager is open) and the cursor's screen for the
# Quick Panel; the same objc2 generation global-hotkey and rfd already pull in.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "libc",
    "std",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSImage",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWorkspace",
] }
# Auto-type: Accessibility trust options and synthesized key events. Both already in the tree
# through objc2-app-kit and arboard.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSGeometry",
    "NSString",
] }
# Native open/save panels for attachments; no portal or Wayland backends on macOS.
rfd = { version = "0.18.0", default-features = false }

[dev-dependencies]
# Registers e2e accounts with the client's own crypto, as the bwl-vault scenarios do.
bwl-crypto.workspace = true
# Internal Slint crate without semver guarantees; must match the slint version exactly.
i-slint-backend-testing = "=1.18.1"
reqwest.workspace = true
tempfile = "3.27.0"
# Paused clock for the hotkey pause limit.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
slint-build = "1.18.1"

[lints]
workspace = true

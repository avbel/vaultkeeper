[package]
name = "vk-platform"
description = "OS integration: keychain, Touch ID, autostart, clipboard, single instance, hardening"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { workspace = true, features = ["zeroize"] }
arboard.workspace = true
directories.workspace = true
hkdf.workspace = true
interprocess.workspace = true
p256 = { workspace = true, features = ["ecdh"] }
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
vk-win.workspace = true
# WinRT only, for the Hello presence check (biometric/consent.rs); Win32 goes through windows-sys.
windows = { version = "0.62.2", default-features = false, features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3.2"
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The updater's signature checks (code_signature.rs); the version security-framework uses.
core-foundation = "0.10.1"
security-framework.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[lints]
workspace = true

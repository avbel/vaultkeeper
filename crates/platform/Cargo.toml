[package]
name = "bwl-platform"
description = "OS integration: keychain, Touch ID, autostart, clipboard, single instance, hardening"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { workspace = true, features = ["zeroize"] }
arboard.workspace = true
directories.workspace = true
hkdf.workspace = true
interprocess.workspace = true
p256 = { workspace = true, features = ["ecdh"] }
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[lints]
workspace = true

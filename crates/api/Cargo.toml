[package]
name = "vk-api"
description = "HTTP client and wire models for the Bitwarden/Vaultwarden API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util = "0.3.34"
reqwest = { workspace = true, features = ["multipart", "stream"] }
rmpv = "1.3.1"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rustls-platform-verifier = "0.7.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true

[package]
name = "vk-vault"
description = "Session state, encrypted cache, decrypted views and vault operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Integration tests against a docker Vaultwarden (VW_URL env var).
vw-it = []

[dependencies]
# `uriChecksum` (base64 of SHA-256); both already in the build through vk-crypto.
base64.workspace = true
# Send dates: the server's RFC 3339 deletion and expiration times.
chrono.workspace = true
vk-api.workspace = true
vk-crypto.workspace = true
vk-gen.workspace = true
# Fuzzy search fallback (the matcher Helix uses): fzf-style scoring, no other dependencies.
nucleo-matcher = "0.3.1"
# `Body` for streaming attachment uploads and the offline probe's `GET /alive`; same version and
# TLS backend as vk-api, so no new crates enter the build.
reqwest = { workspace = true, features = ["stream"] }
psl.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
wiremock.workspace = true

[lints]
workspace = true
